<!DOCTYPE html>
<html>
<head>
<title>Student Registration Form</title>
<style>
  body {
    background-color: #ffe4e1;
    font-family: "Times New Roman", Times, serif;
  }
  h1 {
    text-align: center;
    margin-bottom: 30px;
  }
  table {
    margin: 0 auto;
    border-collapse: separate;
    border-spacing: 10px 15px;
  }
  td.label {
    text-align: left;
    font-size: 16px;
    width: 150px;
  }
  td.input {
    width: 400px;
  }
  input[type="text"], input[type="password"], select, textarea {
    padding: 3px;
    box-sizing: border-box;
  }
  .full-width {
    width: 100%;
  }
  .inline-input {
    width: 45%;
  }
  .small-input {
    width: 50px;
  }
  .date-input {
    width: 60px;
  }
  .center {
    text-align: center;
    margin-top: 20px;
  }
</style>
</head>
<body>

<h1>Student Registration Form</h1>

<form>
  <table>
    <tr>
      <td class="label">Roll no. :</td>
      <td class="input"><input type="number" name="rollno" class="full-width" required min="1"></td>
    </tr>
    <tr>
      <td class="label">Student name :</td>
      <td class="input">
        <input type="text" name="fname" class="inline-input" placeholder="First Name" required pattern="[A-Za-z]+"> - <input type="text" name="lname" class="inline-input" placeholder="Last Name" required pattern="[A-Za-z]+">
      </td>
    </tr>
    <tr>
      <td class="label">Father's name :</td>
      <td class="input"><input type="text" name="fathername" class="full-width" required></td>
    </tr>
    <tr>
      <td class="label">Date of birth :</td>
      <td class="input">
        <input type="date" name="dob" class="full-width" required>
      </td>
    </tr>
    <tr>
      <td class="label">Mobile no. :</td>
      <td class="input">
        <input type="text" class="small-input" value="+91" readonly> - <input type="tel" name="mobile" pattern="[0-9]{10}" required style="width: 80%;">
      </td>
    </tr>
    <tr>
      <td class="label">Email id :</td>
      <td class="input"><input type="email" name="email" class="full-width" required></td>
    </tr>
    <tr>
      <td class="label">Password :</td>
      <td class="input"><input type="password" name="password" class="full-width" required minlength="6"></td>
    </tr>
    <tr>
      <td class="label">Gender :</td>
      <td class="input">
        <input type="radio" name="gender" value="Male" required> Male 
        <input type="radio" name="gender" value="Female" required> Female
      </td>
    </tr>
    <tr>
      <td class="label">Department :</td>
      <td class="input">
        <input type="checkbox" name="dept" value="CSE"> CSE 
        <input type="checkbox" name="dept" value="IT"> IT 
        <input type="checkbox" name="dept" value="ECE"> ECE 
        <input type="checkbox" name="dept" value="Civil"> Civil 
        <input type="checkbox" name="dept" value="Mech"> Mech
      </td>
    </tr>
    <tr>
      <td class="label">Course :</td>
      <td class="input">
        <select name="course" class="full-width" required>
          <option value="">------------------ Select Current Course's ------------------</option>
          <option value="BSc">B.Sc.</option>
          <option value="BCA">BCA</option>
        </select>
      </td>
    </tr>
    <tr>
      <td class="label">Student photo :</td>
      <td class="input"><input type="file" name="photo" accept="image/*" required></td>
    </tr>
    <tr>
      <td class="label">City :</td>
      <td class="input"><input type="text" name="city" class="full-width" required></td>
    </tr>
    <tr>
      <td class="label" style="vertical-align: top;">Address :</td>
      <td class="input">
        <textarea name="address" rows="4" class="full-width" required></textarea>
      </td>
    </tr>
    <tr>
      <td colspan="2" class="center">
        <button type="submit" style="padding: 5px 20px;">Register</button>
      </td>
    </tr>
  </table>
</form>

</body>
</html>
