<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Change Heading Text</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding-top: 100px; }
        h1 { color: #333; }
        button { padding: 12px 24px; font-size: 16px; font-weight: bold; background: #3498db; color: white; border: none; border-radius: 6px; cursor: pointer; }
        button:hover { background: #2980b9; }
    </style>
</head>
<body>
    <h1 id="heading">Hello! Welcome</h1>
    <button onclick="changeText()">Change Text</button>

    <script>
        function changeText() {
            document.getElementById('heading').innerText = "Text Changed Successfully!";
        }
    </script>
</body>
</html>
