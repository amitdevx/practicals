<!DOCTYPE html>
<html>
<head>
<title>College Registration Form</title>
<style>
  body { font-family: Arial, sans-serif; background-color: #f4f4f4; }
  .container { width: 50%; margin: 0 auto; background: #fff; padding: 20px; border-radius: 8px; }
  h2 { text-align: center; }
  .form-group { margin-bottom: 15px; }
  label { display: block; margin-bottom: 5px; }
  input[type="text"], input[type="email"], input[type="password"], input[type="date"], input[type="tel"] {
    width: 100%; padding: 8px; box-sizing: border-box;
  }
  .btn { padding: 10px 15px; background: #28a745; color: #fff; border: none; cursor: pointer; }
</style>
</head>
<body>
<div class="container">
  <h2>College Registration Form</h2>
  <form>
    <div class="form-group">
      <label>Student Name:</label>
      <input type="text" name="sname" required minlength="3" maxlength="20" placeholder="Enter Name">
    </div>
    <div class="form-group">
      <label>Email:</label>
      <input type="email" name="email" required placeholder="Enter Email">
    </div>
    <div class="form-group">
      <label>Mobile No:</label>
      <input type="tel" name="mobile" pattern="[0-9]{10}" required placeholder="10 digit mobile">
    </div>
    <div class="form-group">
      <label>Date of Birth:</label>
      <input type="date" name="dob" required>
    </div>
    <div class="form-group">
      <label>Password:</label>
      <input type="password" name="password" required minlength="8">
    </div>
    <button type="submit" class="btn">Register</button>
  </form>
</div>
</body>
</html>
