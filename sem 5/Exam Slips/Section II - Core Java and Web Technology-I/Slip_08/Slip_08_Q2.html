<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DOM Image Switcher</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 50px; background: #fdfefe; }
        button { padding: 12px 24px; font-size: 16px; background: #2c3e50; color: white; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #1a252f; }
        img { border: 2px solid #ccc; border-radius: 8px; margin-bottom: 20px;}
    </style>
</head>
<body>
    <h2>JavaScript DOM Manipulation & Event Handling</h2>
    <img id="myImage" src="https://via.placeholder.com/300x200?text=Image+1" alt="Image 1"><br>
    <button onclick="toggleImage()">Switch Image</button>

    <script>
        function toggleImage() {
            var img = document.getElementById('myImage');
            if (img.src.includes('Image+1')) {
                img.src = 'https://via.placeholder.com/300x200/e67e22/ffffff?text=Image+2';
                img.alt = 'Image 2';
            } else {
                img.src = 'https://via.placeholder.com/300x200?text=Image+1';
                img.alt = 'Image 1';
            }
        }
    </script>
</body>
</html>
